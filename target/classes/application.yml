server:
  port: 8080

spring:
  application:
    name: load-balancer-api-gateway
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.gateway: DEBUG
